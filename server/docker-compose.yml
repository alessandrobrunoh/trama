# trama API + dedicated Postgres (container name kept: `delta-postgres`).
# Host port 5434 — 5432/5433 belong to other projects.
name: delta
services:
  app:
    image: ghcr.io/alessandrobrunoh/trama:latest
    container_name: trama.alessandrobrunoh.it
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://delta:delta@postgres:5432/trama
      PORT: 3000
      NODE_ENV: production
      CORS_ORIGIN: https://trama.alessandrobrunoh.it
    networks:
      - default
      - proxy
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.trama.rule=Host(`trama.alessandrobrunoh.it`)
      - traefik.http.routers.trama.entrypoints=websecure
      - traefik.http.routers.trama.tls=true
      - traefik.http.routers.trama.tls.certresolver=le
      - traefik.http.services.trama.loadbalancer.server.port=3000

  # MCP server (Rust): talks to the API only, authenticated per client by the API key
  # (Settings → API tokens). Public URL: https://trama.alessandrobrunoh.it/mcp
  mcp:
    image: ghcr.io/alessandrobrunoh/trama-mcp:latest
    build: ../mcp
    container_name: trama-mcp
    restart: unless-stopped
    environment:
      NABLA_API_URL: http://app:3000/api
      MCP_BIND: 0.0.0.0:8080
    networks:
      - default
      - proxy
    depends_on:
      - app
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.trama-mcp.rule=Host(`trama.alessandrobrunoh.it`) && PathPrefix(`/mcp`)
      - traefik.http.routers.trama-mcp.priority=100
      - traefik.http.routers.trama-mcp.entrypoints=websecure
      - traefik.http.routers.trama-mcp.tls=true
      - traefik.http.routers.trama-mcp.tls.certresolver=le
      - traefik.http.services.trama-mcp.loadbalancer.server.port=8080

  postgres:
    image: postgres:18
    container_name: delta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: delta
      POSTGRES_PASSWORD: delta
      POSTGRES_DB: trama
    ports:
      - '127.0.0.1:5434:5432'
    # PG 18+ stores the cluster in a versioned dir under /var/lib/postgresql.
    volumes:
      - delta-pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U delta -d trama']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  delta-pgdata:

networks:
  proxy:
    external: true
