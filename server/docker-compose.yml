# Trama production stack: web (static Angular), app (API), mcp (MCP server) and a dedicated Postgres.
# Public URL: https://trama.alessandrobrunoh.it, routed by Traefik (external network `proxy`):
#   /api -> app, /mcp -> mcp, everything else -> web.
# Needs server/.env.production (copy .env.production.example and fill it in).
# Host port 5434 for Postgres: 5432/5433 belong to other projects.
name: delta

x-hardened: &hardened
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  web:
    <<: *hardened
    image: ghcr.io/alessandrobrunoh/trama-web:latest
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: trama-web
    read_only: true
    tmpfs: [/tmp]
    networks: [proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.trama-web.rule=Host(`trama.alessandrobrunoh.it`)
      - traefik.http.routers.trama-web.priority=1
      - traefik.http.routers.trama-web.entrypoints=websecure
      - traefik.http.routers.trama-web.tls=true
      - traefik.http.routers.trama-web.tls.certresolver=le
      - traefik.http.services.trama-web.loadbalancer.server.port=8080

  app:
    <<: *hardened
    image: ghcr.io/alessandrobrunoh/trama-server:latest
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: trama.alessandrobrunoh.it
    init: true
    read_only: true
    tmpfs: [/tmp]
    # Optional so `npm run db:up` / `db:down` work in development; in production the API refuses to boot
    # without TRAMA_ENCRYPTION_KEY and a DATABASE_URL, so a missing file shows up immediately.
    env_file:
      - path: .env.production
        required: false
    environment:
      PORT: 3000
    networks:
      - default
      - proxy
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.trama.rule=Host(`trama.alessandrobrunoh.it`) && PathPrefix(`/api`)
      - traefik.http.routers.trama.priority=100
      - traefik.http.routers.trama.entrypoints=websecure
      - traefik.http.routers.trama.tls=true
      - traefik.http.routers.trama.tls.certresolver=le
      - traefik.http.services.trama.loadbalancer.server.port=3000

  # MCP server (Rust): talks to the API only, authenticated per client by the API key
  # (Settings → API tokens). Public URL: https://trama.alessandrobrunoh.it/mcp
  mcp:
    <<: *hardened
    image: ghcr.io/alessandrobrunoh/trama-mcp:latest
    build:
      context: ..
      dockerfile: mcp/Dockerfile
    container_name: trama-mcp
    read_only: true
    environment:
      TRAMA_API_URL: http://app:3000/api
      MCP_BIND: 0.0.0.0:8080
    networks:
      - default
      - proxy
    depends_on:
      app:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.trama-mcp.rule=Host(`trama.alessandrobrunoh.it`) && PathPrefix(`/mcp`)
      - traefik.http.routers.trama-mcp.priority=100
      - traefik.http.routers.trama-mcp.entrypoints=websecure
      - traefik.http.routers.trama-mcp.tls=true
      - traefik.http.routers.trama-mcp.tls.certresolver=le
      - traefik.http.services.trama-mcp.loadbalancer.server.port=8080

  postgres:
    image: postgres:18
    container_name: delta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: delta
      POSTGRES_PASSWORD: delta
      POSTGRES_DB: trama
    ports:
      - '127.0.0.1:5434:5432'
    # PG 18+ stores the cluster in a versioned dir under /var/lib/postgresql.
    volumes:
      - delta-pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U delta -d trama']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  delta-pgdata:

networks:
  proxy:
    external: true
