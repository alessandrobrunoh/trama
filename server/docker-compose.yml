# Trama production stack: web (static Angular), app (API), mcp (MCP server) and a dedicated Postgres.
# Public URL: https://trama.alessandrobrunoh.it, routed by Traefik (external network `proxy`):
#   /api -> app, /mcp -> mcp, everything else -> web.
# The API reads its environment from ../.env (the repository root: where deploy tools such as Komodo write the
# stack's environment) and then server/.env.production (copy .env.production.example and fill it in; it wins).
# Postgres is NOT published on the host here: the API reaches it as postgres:5432 on the compose network.
# For development, docker-compose.dev.yml publishes it on localhost:5434 (npm run db:up).
name: delta

x-hardened: &hardened
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  frontend:
    <<: *hardened
    image: ghcr.io/alessandrobrunoh/trama-frontend:latest
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: trama-frontend
    read_only: true
    tmpfs: [/tmp]
    networks: [proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.trama-frontend.rule=Host(`trama.alessandrobrunoh.it`)
      - traefik.http.routers.trama-frontend.priority=1
      - traefik.http.routers.trama-frontend.entrypoints=websecure
      - traefik.http.routers.trama-frontend.tls=true
      - traefik.http.routers.trama-frontend.tls.certresolver=le
      - traefik.http.services.trama-frontend.loadbalancer.server.port=8080

  app:
    <<: *hardened
    image: ghcr.io/alessandrobrunoh/trama-server:latest
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: trama.alessandrobrunoh.it
    init: true
    read_only: true
    tmpfs: [/tmp]
    # Both files are optional so `npm run db:up` / `db:down` work in development; in production the API refuses
    # to boot without TRAMA_ENCRYPTION_KEY and a DATABASE_URL, so missing variables show up immediately.
    # Note: `--env-file` on the docker compose command only fills ${VARS} in this file; it does not reach the
    # container. That is why the deploy's .env is listed here explicitly (paths are relative to this file).
    env_file:
      - path: ../.env
        required: false
      - path: .env.production
        required: false
    environment:
      PORT: 3000
    networks:
      - default
      - proxy
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.trama.rule=Host(`trama.alessandrobrunoh.it`) && PathPrefix(`/api`)
      - traefik.http.routers.trama.priority=100
      - traefik.http.routers.trama.entrypoints=websecure
      - traefik.http.routers.trama.tls=true
      - traefik.http.routers.trama.tls.certresolver=le
      - traefik.http.services.trama.loadbalancer.server.port=3000

  # MCP server (Rust): talks to the API only, authenticated per client by the API key
  # (Settings → API tokens). Public URL: https://trama.alessandrobrunoh.it/mcp
  mcp:
    <<: *hardened
    image: ghcr.io/alessandrobrunoh/trama-mcp:latest
    build:
      context: ..
      dockerfile: mcp/Dockerfile
    container_name: trama-mcp
    read_only: true
    environment:
      TRAMA_API_URL: http://app:3000/api
      MCP_BIND: 0.0.0.0:8080
    networks:
      - default
      - proxy
    depends_on:
      app:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.trama-mcp.rule=Host(`trama.alessandrobrunoh.it`) && PathPrefix(`/mcp`)
      - traefik.http.routers.trama-mcp.priority=100
      - traefik.http.routers.trama-mcp.entrypoints=websecure
      - traefik.http.routers.trama-mcp.tls=true
      - traefik.http.routers.trama-mcp.tls.certresolver=le
      - traefik.http.services.trama-mcp.loadbalancer.server.port=8080

  postgres:
    image: postgres:18
    container_name: delta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: delta
      # Set POSTGRES_PASSWORD in the stack's environment and use the same one in DATABASE_URL. It only
      # applies when the data volume is first created: for an existing volume run
      # ALTER USER delta PASSWORD '...' once (see docker/README.md). Defaults to "delta" for development.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-delta}
      POSTGRES_DB: trama
    # PG 18+ stores the cluster in a versioned dir under /var/lib/postgresql.
    volumes:
      - delta-pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U delta -d trama']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  delta-pgdata:

networks:
  proxy:
    external: true
