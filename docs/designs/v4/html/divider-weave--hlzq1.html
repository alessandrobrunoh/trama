<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      tailwind = { config: { corePlugins: { preflight: false } } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      *, ::before, ::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div
      data-pencil-id="hlzq1"
      data-pencil-name="Divider / Weave"
      class="box-border w-[1200px] h-[25px] flex flex-row gap-0 justify-start items-center"
    >
      <div
        data-pencil-id="BmMaa"
        data-pencil-name="Line left"
        class="box-border w-[116px] shrink-0 h-[1px] bg-[#24272D]"
      ></div>
      <div
        data-pencil-id="ngkja"
        data-pencil-name="Crossing"
        class="box-border w-[9px] shrink-0 h-[25px] relative"
      >
        <div
          data-pencil-id="cCw2p"
          data-pencil-name="Warp"
          class="box-border w-[1px] h-[25px] absolute left-[4px] top-0 bg-[#E2A93B] [z-index:0]"
        ></div>
      </div>
      <div
        data-pencil-id="tOvk5"
        data-pencil-name="Line right"
        class="box-border [flex:1_1_0] h-[1px] bg-[#24272D]"
      ></div>
    </div>
  </body>
</html>
