name: Docker

# Compose/Caddy config and all application images must stay valid, and the self-host stack must
# refuse to start without its secrets (there are no default passwords).
on:
  pull_request:
    paths:
      - 'docker-compose.selfhost.yml'
      - 'docker/**'
      - 'server/docker-compose*.yml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'server/Dockerfile'
      - 'server/Dockerfile.dockerignore'
      - 'mcp/Dockerfile'
      - 'mcp/Dockerfile.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'angular.json'
      - 'tsconfig*.json'
      - 'ngsw-config.json'
      - '.postcssrc.json'
      - 'public/**'
      - 'src/**'
      - 'server/package.json'
      - 'server/package-lock.json'
      - 'server/nest-cli.json'
      - 'server/tsconfig*.json'
      - 'server/src/**'
      - 'mcp/Cargo.toml'
      - 'mcp/Cargo.lock'
      - 'mcp/src/**'
      - '.github/workflows/docker-ci.yml'
      - '.github/workflows/release-images.yml'
  push:
    branches: [main]
    paths:
      - 'docker-compose.selfhost.yml'
      - 'docker/**'
      - 'server/docker-compose*.yml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'server/Dockerfile'
      - 'server/Dockerfile.dockerignore'
      - 'mcp/Dockerfile'
      - 'mcp/Dockerfile.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'angular.json'
      - 'tsconfig*.json'
      - 'ngsw-config.json'
      - '.postcssrc.json'
      - 'public/**'
      - 'src/**'
      - 'server/package.json'
      - 'server/package-lock.json'
      - 'server/nest-cli.json'
      - 'server/tsconfig*.json'
      - 'server/src/**'
      - 'mcp/Cargo.toml'
      - 'mcp/Cargo.lock'
      - 'mcp/src/**'
      - '.github/workflows/docker-ci.yml'
      - '.github/workflows/release-images.yml'

permissions:
  contents: read

concurrency:
  group: docker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: compose config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Self-host file is valid with its secrets set
        env:
          TRAMA_PUBLIC_URL: https://trama.example.com
          POSTGRES_PASSWORD: ci-password
          TRAMA_ENCRYPTION_KEY: ci-key
        run: docker compose -f docker-compose.selfhost.yml config --quiet
      - name: Self-host file refuses to start without secrets
        run: |
          if docker compose -f docker-compose.selfhost.yml config --quiet 2>err.txt; then
            echo "::error::docker-compose.selfhost.yml accepted a configuration without secrets"
            exit 1
          fi
          grep -q "required variable" err.txt
      - name: Caddyfile is valid
        run: |
          docker run --rm -e TRAMA_PUBLIC_URL=https://trama.example.com \
            -v "$PWD/docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Author's deployment file is still valid
        env:
          POSTGRES_PASSWORD: ci-password
        run: docker compose -f server/docker-compose.yml config --quiet

  images:
    name: Build ${{ matrix.image }} image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: frontend
            dockerfile: Dockerfile
          - image: server
            dockerfile: server/Dockerfile
          - image: mcp
            dockerfile: mcp/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
