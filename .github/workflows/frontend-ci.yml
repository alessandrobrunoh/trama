name: Frontend

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'contracts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'angular.json'
      - 'tsconfig*.json'
      - 'ngsw-config.json'
      - '.postcssrc.json'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'contracts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'angular.json'
      - 'tsconfig*.json'
      - 'ngsw-config.json'
      - '.postcssrc.json'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # The production configuration enforces the bundle budgets in angular.json: a budget error fails the
      # build, a budget warning does not. There is no frontend lint or test script yet (`ng test` has no specs).
      - run: npm run build
