<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Trama</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#08090a" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Trama" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Trama — where humans and agents get work done together." />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="icons/icon-180x180.png" />
    <link
      rel="preload"
      href="fonts/InterVariable.woff2"
      as="font"
      type="font/woff2"
      crossorigin=""
    />
    <!-- Apply the saved theme before first paint (no flash). Mirrors core/theme/theme.service.ts. -->
    <script>
      (function () {
        var el = document.documentElement;
        // One-time move of the pre-rename `nabla.*` localStorage keys to `trama.*`, so people keep
        // their settings. A key that already exists under the new name wins; the old one is dropped.
        try {
          var legacy = [];
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (k && k.indexOf('nabla.') === 0) legacy.push(k);
          }
          legacy.forEach(function (old) {
            var next = 'trama.' + old.slice('nabla.'.length);
            if (localStorage.getItem(next) === null) localStorage.setItem(next, localStorage.getItem(old));
            localStorage.removeItem(old);
          });
        } catch (e) {}
        try {
          var pref = localStorage.getItem('trama.theme') || 'system';
          var dark =
            pref === 'dark' ||
            (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) el.classList.add('dark');
          el.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
        // Personal preferences (core/preferences.ts): same attributes, before first paint.
        try {
          var p = JSON.parse(localStorage.getItem('trama.preferences.v1') || '{}');
          var scale = { small: 0.9, large: 1.1, xlarge: 1.2 }[p.fontSize];
          if (scale) {
            el.style.setProperty('--font-scale', String(scale));
            el.dataset.fontSize = p.fontSize;
          }
          if (p.pointerCursors === false) el.dataset.pointerCursors = 'false';
          if (p.underlineLinks === true) el.dataset.underlineLinks = 'true';
          if (p.motion === 'reduce' || p.motion === 'full') el.dataset.motion = p.motion;
        } catch (e) {}
      })();
    </script>
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
