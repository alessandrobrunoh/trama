<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nabla</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f5f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Nabla — where humans and agents get work done together." />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preload" href="fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Apply the saved theme before first paint (no flash). Mirrors core/theme/theme.service.ts. -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('nabla.theme') || 'system';
          var dark =
            pref === 'dark' ||
            (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var el = document.documentElement;
          if (dark) el.classList.add('dark');
          el.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
