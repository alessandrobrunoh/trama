# Static Angular app. The reverse proxy (Traefik) sends /api to the API and /mcp to the MCP server.
server {
  listen 8080;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # Files were gzipped at build time (see Dockerfile).
  gzip_static on;
  gzip_vary on;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # If the proxy ever routes these here, fail loudly instead of answering with the SPA shell.
  location ^~ /api/ { return 404; }
  location ^~ /mcp  { return 404; }

  # Content-hashed build output (main-XXXXXXXX.js, chunk-XXXXXXXX.js, styles-XXXXXXXX.css, fonts): cache forever.
  location ~* "-[A-Za-z0-9_]{8}\.(?:js|css|woff2)$" {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Entry point and service-worker metadata must always be revalidated or updates never reach users.
  location ~ ^/(?:index\.html|ngsw\.json|ngsw-worker\.js|safety-worker\.js|worker-basic\.min\.js|manifest\.webmanifest)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # Other static files (icons, images): not hashed, so a short cache.
  location ~* \.(?:png|jpg|jpeg|gif|webp|avif|svg|ico|woff|txt|xml|json)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  # Client-side routes.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
